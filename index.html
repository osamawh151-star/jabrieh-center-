<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جبرية سنتر للإلكترونيات - نظام الكفالات والشروط</title>
    <style>
        :root {
            --gold: #c5a059;
            --dark: #121212;
            --light-bg: #f9f9f9;
            --text-main: #333333;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--light-bg);
            color: var(--text-main);
            padding: 15px;
        }
        .wrapper {
            max-width: 650px;
            margin: 0 auto;
        }
        /* صندوق تسجيل الدخول */
        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border-top: 5px solid var(--gold);
            margin-top: 50px;
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--dark);
        }
        /* التطبيق الرئيسي */
        .app-container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border-top: 5px solid var(--gold);
            display: none;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }
        .header h1 {
            color: var(--dark);
            font-size: 22px;
        }
        .header p {
            color: var(--gold);
            font-weight: bold;
            font-size: 14px;
        }
        .nav-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .nav-bar button {
            flex: 1;
            padding: 10px 5px;
            background: #f1f1f1;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-main);
            transition: 0.3s;
        }
        .nav-bar button.active {
            background: var(--gold);
            color: white;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 13px;
            color: var(--dark);
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus, textarea:focus {
            border-color: var(--gold);
            outline: none;
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
        .btn-submit {
            width: 100%;
            background: var(--gold);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover {
            opacity: 0.9;
        }
        .btn-logout {
            background: #d9534f;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            float: left;
        }
        .result-box {
            background: #fafafa;
            border: 1px solid #e2d2b5;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- شاشة تسجيل الدخول -->
        <div id="loginScreen" class="login-card">
            <h2>جبرية سنتر</h2>
            <p style="text-align: center; color: #666; margin-bottom: 20px; font-size: 13px;">تسجيل الدخول لنظام الكفالات</p>
            <div class="form-group">
                <label>اسم المستخدم:</label>
                <input type="text" id="userInput" placeholder="أدخل اسم المستخدم">
            </div>
            <div class="form-group">
                <label>كلمة المرور:</label>
                <input type="password" id="passInput" placeholder="أدخل كلمة المرور">
            </div>
            <button class="btn-submit" onclick="handleLogin()">دخول للنظام</button>
        </div>

        <!-- الواجهة الرئيسية للبرنامج -->
        <div id="mainApp" class="app-container">
            <button class="btn-logout" onclick="handleLogout()">تسجيل خروج</button>
            <div class="header">
                <h1>جبرية سنتر للإلكترونيات</h1>
                <p>إدارة الكفالات والشروط - بيت لحم</p>
            </div>

            <div class="nav-bar">
                <button id="tabAddBtn" class="active" onclick="switchTab('add')">إضافة كفالة</button>
                <button id="tabSearchBtn" onclick="switchTab('search')">بحث الكفالات</button>
                <button id="tabSettingsBtn" onclick="switchTab('settings')">إعدادات الشروط</button>
            </div>

            <!-- تبويب الإضافة -->
            <div id="addSection" class="section active">
                <div class="form-group">
                    <label>اسم الزبون (الثلاثي):</label>
                    <input type="text" id="clientName" placeholder="اسم الزبون الكامل">
                </div>
                <div class="form-group">
                    <label>نوع الجهاز:</label>
                    <input type="text" id="deviceType" placeholder="مثال: Samsung Galaxy A54">
                </div>
                <div class="form-group">
                    <label>تاريخ الشراء:</label>
                    <input type="date" id="purchaseDate">
                </div>
                <div class="form-group">
                    <label>اسم البائع:</label>
                    <input type="text" id="sellerName" placeholder="الموظف البائع">
                </div>
                <div class="form-group">
                    <label>مدة الضمان:</label>
                    <input type="text" id="warrantyPeriod" placeholder="مثال: سنة واحدة">
                </div>
                <div class="form-group">
                    <label>الرقم التسلسلي (IMEI / Serial):</label>
                    <input type="text" id="serialNo" placeholder="أدخل رقم السيريال هنا">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف:</label>
                    <input type="text" id="clientPhone" placeholder="059xxxxxxxx">
                </div>
                <button class="btn-submit" onclick="saveWarranty()">حفظ الكفالة في النظام</button>
            </div>

            <!-- تبويب البحث -->
            <div id="searchSection" class="section">
                <div class="form-group">
                    <label>بحث سريع (بالاسم أو السيريال):</label>
                    <input type="text" id="searchInput" placeholder="اكتب للبحث الفوري..." oninput="performSearch()">
                </div>
                <div id="searchResults" style="margin-top: 15px;">
                    <p style="color: #888; text-align: center;">ابدأ الكتابة للبحث عن الكفالات المحفوظة...</p>
                </div>
            </div>

            <!-- تبويب إعدادات الشروط -->
            <div id="settingsSection" class="section">
                <h3 style="margin-bottom: 15px; color: var(--dark);">تعديل شروط الكفالة والضمان</h3>
                <div class="form-group">
                    <label>بنود وشروط الضمان الحالية:</label>
                    <textarea id="warrantyTermsInput">
- الكفالة لا تشمل:
1. الكسر والحروق والسوائل حتى لو كان الجهاز مضاد للمياه.
2. وفي حال وجود كسر أو حرق أو سوائل أو خشين تلغي الكفالة فوراً.
3. سوء الاستخدام الجهاز واستعمال شاحن غير التأمين الأصلي.
4. خراب مدخل الشحن أو الشاحن ومرفقاته الجهاز.
5. إغلاق الجهاز على حساب الـ GMAIL أو الـ iCLOUD.
6. تعديل الجهاز بعد خروجه من المعرض نهائياً.
- تتم مسؤولية الكفالة على الشركة وليس على المعرض وتقتصر مسؤولية المعرض فقط لتوصيل الجهاز إلى الشركة للصيانة والمراجعة.
- فترة تواجد الجهاز في الصيانة على الكفالة لا يوم وإذا كان الجهاز من منتجات شركة APPLE تكون الفترة 4 يوم عمل.
- غير الزبون بالسوانفة على هذه الشروط والتوقيع عليها.
                    </textarea>
                </div>
                <button class="btn-submit" onclick="saveTerms()">حفظ التعديلات والشروط</button>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedTerms = localStorage.getItem('jabrieh_custom_terms');
            if(savedTerms) {
                document.getElementById('warrantyTermsInput').value = savedTerms;
            }
        };

        function handleLogin() {
            const u = document.getElementById('userInput').value.trim();
            const p = document.getElementById('passInput').value.trim();
            
            if(u === "admin" && p === "1234") {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                document.getElementById('purchaseDate').valueAsDate = new Date();
            } else {
                alert('اسم المستخدم أو كلمة المرور غير صحيحة!');
            }
        }

        function handleLogout() {
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('userInput').value = '';
            document.getElementById('passInput').value = '';
        }

        function switchTab(tab) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-bar button').forEach(b => b.classList.remove('active'));

            if(tab === 'add') {
                document.getElementById('addSection').classList.add('active');
                document.getElementById('tabAddBtn').classList.add('active');
            } else if(tab === 'search') {
                document.getElementById('searchSection').classList.add('active');
                document.getElementById('tabSearchBtn').classList.add('active');
            } else if(tab === 'settings') {
                document.getElementById('settingsSection').classList.add('active');
                document.getElementById('tabSettingsBtn').classList.add('active');
            }
        }

        function saveWarranty() {
            const data = {
                clientName: document.getElementById('clientName').value.trim(),
                deviceType: document.getElementById('deviceType').value.trim(),
                purchaseDate: document.getElementById('purchaseDate').value,
                sellerName: document.getElementById('sellerName').value.trim(),
                warrantyPeriod: document.getElementById('warrantyPeriod').value.trim(),
                serialNo: document.getElementById('serialNo').value.trim(),
                clientPhone: document.getElementById('clientPhone').value.trim()
            };

            if(!data.clientName || !data.serialNo) {
                alert('الرجاء إدخال اسم الزبون ورقم السيريال كحد أدنى!');
                return;
            }

            let list = JSON.parse(localStorage.getItem('jabrieh_warranties_new') || '[]');
            list.push(data);
            localStorage.setItem('jabrieh_warranties_new', JSON.stringify(list));

            alert('تم حفظ الكفالة بنجاح ولن تضيع أبداً!');
            
            document.getElementById('clientName').value = '';
            document.getElementById('deviceType').value = '';
            document.getElementById('sellerName').value = '';
            document.getElementById('warrantyPeriod').value = '';
            document.getElementById('serialNo').value = '';
            document.getElementById('clientPhone').value = '';
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const list = JSON.parse(localStorage.getItem('jabrieh_warranties_new') || '[]');
            const container = document.getElementById('searchResults');
            
            container.innerHTML = '';

            if(!query) {
                container.innerHTML = '<p style="color: #888; text-align: center;">ابدأ الكتابة للبحث عن الكفالات المحفوظة...</p>';
                return;
            }

            const filtered = list.filter(item => 
                item.clientName.toLowerCase().includes(query) || 
                item.serialNo.toLowerCase().includes(query)
            );

            if(filtered.length === 0) {
                container.innerHTML = '<p style="color: #d9534f; text-align: center;">لا توجد أي كفالة مطابقة للبحث.</p>';
                return;
            }

            filtered.forEach(item => {
                container.innerHTML += `
                    <div class="result-box">
                        <strong>الزبون:</strong> ${item.clientName}<br>
                        <strong>الجهاز:</strong> ${item.deviceType}<br>
                        <strong>السيريال (IMEI):</strong> <span style="color: var(--gold); font-weight: bold;">${item.serialNo}</span><br>
                        <strong>تاريخ الشراء:</strong> ${item.purchaseDate}<br>
                        <strong>مدة الضمان:</strong> ${item.warrantyPeriod}<br>
                        <strong>البائع:</strong> ${item.sellerName} | <strong>الهاتف:</strong> ${item.clientPhone}
                    </div>
                `;
            });
        }

        function saveTerms() {
            const termsText = document.getElementById('warrantyTermsInput').value;
            localStorage.setItem('jabrieh_custom_terms', termsText);
            alert('تم حفظ وتعديل شروط الكفالة بنجاح!');
        }
    </script>
</body>
</html>
